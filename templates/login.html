<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>妖币系统 - 登录</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<style>
 body { background: linear-gradient(135deg, #0f172a, #1e293b); height: 100vh; display: flex; align-items: center; justify-content: center; }
 .login-box { background: rgba(255,255,255,0.05); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.15); border-radius: 1.25rem; padding: 2.5rem; width: 100%; max-width: 380px; }
 .login-box h1 { color: #fff; font-size: 1.5rem; font-weight: 700; }
 @media (max-width: 420px) {
   body { padding: 1rem; }
   .login-box { padding: 1.75rem 1.25rem; max-width: 100%; border-radius: 1rem; }
   .login-box h1 { font-size: 1.25rem; }
 }
</style>
</head>
<body>
<div class="login-box">
  <h1 class="mb-4 text-center">妖币自动交易系统 <span class="badge bg-warning text-dark">V2.0</span></h1>
  {% if error %}<div class="alert alert-danger py-2 small">{{ error }}</div>{% endif %}
  <form method="POST" action="/login">
    <div class="mb-3">
      <label class="form-label text-white small">用户名</label>
      <input type="text" name="username" class="form-control" autocomplete="username" required>
    </div>
    <div class="mb-4">
      <label class="form-label text-white small">密码</label>
      <input type="password" name="password" class="form-control" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-warning w-100 fw-bold">登 录</button>
  </form>
  <div class="text-center mt-3">
    <a href="/register" class="text-white-50 small">没有账号？去注册</a>
  </div>
</div>
</body>
</html>
